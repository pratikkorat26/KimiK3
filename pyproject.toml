[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-k3"
version = "0.1.0"
description = "Readable PyTorch reference implementation of the Kimi K3 architecture"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["kimi_k3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
