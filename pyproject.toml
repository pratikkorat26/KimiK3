[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-k3"
version = "0.1.0"
description = "Readable PyTorch reference implementation of the Kimi K3 architecture"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]
train = [
    "tiktoken>=0.7",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
include = ["kimi_k3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
# 120 accommodates the deliberate trailing shape-annotation comments in the
# attention/MoE math (e.g. kda_ops.py) without wrapping them into noise.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Study reference: full-strictness typing is a non-goal. Kept lenient so mypy
# checks annotated signatures without flagging the dynamically-typed torch hot
# paths. Tighten (e.g. check_untyped_defs) once the code is fully annotated.
