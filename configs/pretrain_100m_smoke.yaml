artifact_root: .artifacts/smoke
run_name: kimi-k3-100m-smoke
model_preset: small

tokenizer:
  vocab_size: 8192
  sample_bytes: 1000000
  model_max_length: 512
  artifact_name: smoke-v1

data:
  train_tokens: 1048576
  validation_tokens: 49152
  shard_tokens: 262144
  artifact_name: smoke-v1
  sources:
    - name: english
      dataset: HuggingFaceTB/smollm-corpus
      subset: fineweb-edu-dedup
      revision: main
      text_field: text
      weight: 0.7
      declared_license: odc-by-1.0
    - name: code
      dataset: common-pile/stackv2_edu_filtered
      subset: null
      revision: main
      text_field: text
      weight: 0.2
      declared_license: per-document-open-license
    - name: math
      dataset: HuggingFaceTB/finemath
      subset: finemath-4plus
      revision: main
      text_field: text
      weight: 0.1
      declared_license: odc-by-1.0

optimizer:
  name: adamw
  learning_rate: 0.0003
  final_learning_rate: 0.00003
  warmup_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  max_grad_norm: 1.0

runtime:
  seed: 42
  micro_batch_size: 1
  effective_batch_tokens: 8192
  eval_steps: 10
  save_steps: 10
  logging_steps: 1
  dataloader_num_workers: 2
  bf16: true
  max_elapsed_days: 1.0
  keep_last_checkpoints: 2
  periodic_eval_tokens_per_source: 8192

curriculum:
  - name: smoke-context-512
    tokens: 1048576
    sequence_length: 512
    gradient_accumulation_steps: 16
